name: Update Report Card Data from Airtable

on:
  schedule:
    - cron: '0 6 1 * *'   # 1st of every month at 6 AM UTC
    - cron: '0 6 15 * *'  # 15th of every month at 6 AM UTC
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: '22'

      - name: Fetch Airtable data and write data.js
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE: ${{ secrets.AIRTABLE_BASE }}
        run: node scripts/fetch-airtable.js

      - name: Commit data.js only
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.js
          if git diff --staged --quiet; then
            echo "No changes."
          else
            git commit -m "data: refresh from Airtable $(date -u '+%Y-%m-%d')"
            git push
          fi
