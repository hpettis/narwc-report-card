name: Update Report Card Data from Airtable

on:
  # Run automatically every day at 6:00 AM UTC
  schedule:
    - cron: '0 6 * * *'

  # Also allow manual trigger from the GitHub Actions tab
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest

    permissions:
      contents: write  # Needed to commit the updated index.html back to the repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch data from Airtable and update index.html
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE: ${{ secrets.AIRTABLE_BASE }}
        run: node scripts/fetch-airtable.js

      - name: Commit updated index.html if data changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --staged --quiet; then
            echo "No data changes detected — skipping commit."
          else
            git commit -m "Auto-update: refresh Airtable data $(date -u '+%Y-%m-%d')"
            git push
          fi
